name: Security & PR Checks

on:
  pull_request:
    branches: [ "main", "master" ]

jobs:
  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner (FS & Repo)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1' # Fails the step and workflow if vulnerabilities are found
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # Optional: Add test/lint steps if required by Vanta's test suite
      # - name: Run Linter / Tests
      #   run: |
      #     npm test # or pytest, etc.
